{% extends "hub/base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-lg border-0 p-5">
            <div class="text-danger display-1 mb-4"><i class="fa-solid fa-circle-exclamation"></i></div>
            <h3>Are you sure?</h3>
            <p class="text-muted mb-4">You are about to delete the dataset: <br><strong>"{{ object.name }}"</strong>. This action cannot be undone.</p>
            
            <form action="" method="post">
                {% csrf_token %}
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger py-3 fw-bold">YES, DELETE PERMANENTLY</button>
                    <a href="{% url 'hub:dataset-list' %}" class="btn btn-light py-2">No, take me back</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
