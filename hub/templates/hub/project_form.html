{% extends "hub/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0 mt-4">
            <div class="card-header bg-primary text-white p-3">
                <h4 class="mb-0"><i class="fa-solid fa-file-pen me-2"></i> {{ object|yesno:"Update,Create" }} Project</h4>
            </div>
            <div class="card-body p-4">
                <form action="" method="post" novalidate>
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text text-muted">{{ field.help_text }}</div>
                            {% endif %}
                            {% for error in field.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% url 'hub:project-list' %}" class="btn btn-outline-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5">Save Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    input[type="text"], input[type="date"], select, textarea { 
        display: block; 
        width: 100%; 
        padding: .375rem .75rem; 
        border: 1px solid #dee2e6; 
        border-radius: .375rem; 
    }
    /* Melhora o espaçamento dos checkboxes de analistas */
    input[type="checkbox"] {
        margin-right: 8px;
        transform: scale(1.1);
        cursor: pointer;
    }
    ul#id_assignees {
        list-style: none;
        padding-left: 0;
        margin-top: 5px;
    }
    ul#id_assignees li {
        margin-bottom: 8px;
    }
</style>
{% endblock %}
