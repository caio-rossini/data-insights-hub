<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Data Insights Hub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; }
        .sidebar a { color: #rgba(255,255,255,0.75); }
        .sidebar a:hover { color: #fff; background-color: #343a40; }
        .card-counter { border-left: 5px solid #0d6efd; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3 text-white">
            <h4 class="text-center mb-4"><i class="fa-solid fa-chart-network text-info"></i> Insights Hub</h4>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="{% url 'hub:index' %}" class="nav-link text-white"><i class="fa-solid fa-gauge me-2"></i> Dashboard</a>
                </li>
                <li>
                    <a href="{% url 'hub:project-list' %}" class="nav-link text-white"><i class="fa-solid fa-diagram-project me-2"></i> Projects</a>
                </li>
                <li>
                    <a href="{% url 'hub:dataset-list' %}" class="nav-link text-white"><i class="fa-solid fa-database me-2"></i> Datasets</a>
                </li>
                <li>
                    <a href="{% url 'hub:domain-list' %}" class="nav-link text-white"><i class="fa-solid fa-tags me-2"></i> Domains</a>
                </li>
                <li>
                    <a href="{% url 'hub:analyst-list' %}" class="nav-link text-white"><i class="fa-solid fa-users me-2"></i> Analysts</a>
                </li>
            </ul>
            <hr>
            <div class="dropdown">
                {% if user.is_authenticated %}
                    <span class="d-flex align-items-center text-white text-decoration-none">
                        <i class="fa-solid fa-user-gear me-2"></i> <strong>{{ user.username }}</strong>
                    </span>
                {% else %}
                    <a href="#" class="text-white text-decoration-none"><i class="fa-solid fa-right-to-bracket me-2"></i> Login</a>
                {% endif %}
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
